<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哪一處是我的家？</title>
    <style>
        :root {
            --water-bg: #caf0f8;
            --sand-bg: #ffe8d6;
            --primary-green: #7fb069;
        }
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            text-align: center;
            background: linear-gradient(180deg, #e0f2f1 0%, #a5d6a7 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            width: 95%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 40px;
            border: 8px solid white;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        .screen { display: none; }
        .active { display: block; }
        
        .header-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }
        .info-box {
            font-size: 22px;
            font-weight: bold;
            background: #f1f8e9;
            padding: 10px 20px;
            border-radius: 20px;
            color: #386641;
        }

        /* 植物展示區 */
        #plant-display {
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .plant-card {
            font-size: 100px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .bounce { animation: bounce 2s infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        #plant-name {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-top: 10px;
        }

        /* 按鈕區 */
        .environments {
            display: flex;
            gap: 15px;
        }
        .env-zone {
            flex: 1;
            height: 160px;
            border-radius: 25px;
            border: 4px solid white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 0px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .env-zone:active { transform: translateY(4px); box-shadow: 0 2px 0px rgba(0,0,0,0.1); }
        
        #water-zone { background-color: var(--water-bg); color: #0077b6; }
        #sand-zone { background-color: var(--sand-bg); color: #e67e22; }

        .env-icon { font-size: 50px; }
        .env-label { font-size: 24px; font-weight: bold; }

        /* 結果頁面 */
        .total-score { font-size: 60px; color: #f94144; margin: 10px 0; }
        .btn-restart {
            background: #ff9f1c;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #e67e22;
        }

        /* 動效 */
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="game-screen" class="screen active">
        <div class="header-info">
            <div class="info-box">⏱️ <span id="timer-val">30</span></div>
            <div class="info-box">⭐ <span id="score-val">0</span></div>
        </div>
        
        <div id="plant-display">
            <div id="current-plant" class="plant-card bounce">🌵</div>
            <div id="plant-name">載入中...</div>
        </div>

        <div class="environments">
            <div id="water-zone" class="env-zone" onclick="checkAnswer('water')">
                <span class="env-icon">💧</span>
                <span class="env-label">小水池</span>
            </div>
            <div id="sand-zone" class="env-zone" onclick="checkAnswer('sand')">
                <span class="env-icon">☀️</span>
                <span class="env-label">大沙漠</span>
            </div>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h1 style="color:#386641">🎉 時間到！</h1>
        <div style="font-size: 80px">🏆</div>
        <div class="total-score"><span id="final-score">0</span> 分</div>
        <p id="praise-msg" style="font-size: 24px; font-weight: bold;"></p>
        <button class="btn-restart" onclick="location.reload()">再玩一次 🌈</button>
    </div>
</div>

<script>
    const plants = [
        { name: '仙人掌', icon: '🌵', home: 'sand' },
        { name: '荷花', icon: '🪷', home: 'water' },
        { name: '駱駝刺', icon: '🌿', home: 'sand' },
        { name: '睡蓮', icon: '🌸', home: 'water' },
        { name: '蘆葦', icon: '🌾', home: 'water' },
        { name: '多肉植物', icon: '🪴', home: 'sand' },
        { name: '水藻', icon: '🌿', home: 'water' },
        { name: '生石花', icon: '💎', home: 'sand' }
    ];

    let score = 0;
    let timeLeft = 30;
    let timerId = null;
    let currentIdx = 0;
    let audioCtx = null;

    // 音效
    function playBeep(freq) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } catch(e) { console.log("Audio not supported"); }
    }

    function initGame() {
        score = 0;
        timeLeft = 30;
        document.getElementById('game-screen').classList.add('active');
        document.getElementById('result-screen').classList.remove('active');
        refreshPlant();
        startCountdown();
    }

    function startCountdown() {
        if(timerId) clearInterval(timerId);
        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-val').textContent = timeLeft;
            if(timeLeft <= 0) gameOver();
        }, 1000);
    }

    function refreshPlant() {
        currentIdx = Math.floor(Math.random() * plants.length);
        const p = plants[currentIdx];
        const card = document.getElementById('current-plant');
        card.textContent = p.icon;
        card.className = 'plant-card bounce';
        document.getElementById('plant-name').textContent = p.name;
    }

    function checkAnswer(choice) {
        const p = plants[currentIdx];
        const card = document.getElementById('current-plant');

        if(choice === p.home) {
            score += 10;
            document.getElementById('score-val').textContent = score;
            playBeep(880);
            card.textContent = ' (｡◕∀◕｡) ';
            setTimeout(refreshPlant, 500);
        } else {
            playBeep(220);
            card.className = 'plant-card shake';
            setTimeout(() => {
                card.textContent = p.icon;
                card.className = 'plant-card bounce';
            }, 500);
        }
    }

    function gameOver() {
        clearInterval(timerId);
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('final-score').textContent = score;
        
        let msg = "再接再厲喔！";
        if(score >= 80) msg = "你是超級植物小專家！";
        else if(score >= 40) msg = "做得好！你是環保小尖兵！";
        document.getElementById('praise-msg').textContent = msg;
    }

    // 啟動
    document.addEventListener('DOMContentLoaded', initGame);
</script>

</body>
</html>
