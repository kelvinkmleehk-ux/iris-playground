<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcherSprayer Shooting - Ocean Saver</title>
    <style>
        :root {
            --sky-blue: #5C94FC;
            --ocean-blue: #0077be;
            --mario-yellow: #f1c40f;
            --target-red: #FF3131;
        }

        body {
            margin: 0; padding: 0;
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: #222;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        #game-container {
            width: 800px; height: 600px;
            background: linear-gradient(to bottom, var(--sky-blue) 0%, var(--ocean-blue) 100%);
            border: 6px solid #fff;
            position: relative; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* 海洋裝飾 */
        .sea-bed {
            position: absolute; bottom: 0; width: 100%; height: 60px;
            background: #D2B48C; border-top: 4px solid #8B4513; z-index: 5;
        }

        /* Pixel 珊瑚 */
        .coral {
            position: absolute; bottom: 60px; width: 40px; height: 50px;
            background: #ff6b6b; border-radius: 10px 10px 0 0; z-index: 6;
            box-shadow: -15px -10px 0 #ff6b6b, 15px -5px 0 #ff6b6b;
        }

        /* 漂浮的魚與海龜 */
        .fish {
            position: absolute; font-size: 30px; z-index: 4;
            animation: swim linear infinite;
        }

        @keyframes swim {
            from { left: -50px; }
            to { left: 850px; }
        }

        /* 頁面管理 - 強制顯示邏輯 */
        .page {
            width: 100%; height: 100%;
            display: none; /* 預設全部關閉 */
            flex-direction: column; justify-content: center;
            align-items: center; text-align: center;
            position: relative; z-index: 20;
        }

        /* 只有這個 Class 能讓頁面出現 */
        .active-page { display: flex !important; }

        .instruction-box {
            background: rgba(0, 0, 0, 0.85); color: white;
            padding: 25px; border: 4px solid #5AC8FA; border-radius: 15px;
            max-width: 85%; line-height: 1.8; font-size: 1.2rem; margin-top: 20px;
        }

        .btn {
            padding: 18px 45px; background: var(--mario-yellow);
            border: 4px solid #000; border-radius: 12px; font-size: 1.6rem;
            font-weight: bold; cursor: pointer; box-shadow: 0 6px #886a08;
            margin-top: 20px;
        }
        .btn:hover { background: #ffd740; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px #886a08; }

        /* 遊戲介面 */
        #game-hud {
            position: absolute; top: 20px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 40px;
            box-sizing: border-box; font-size: 2.2rem; font-weight: bold;
            color: white; text-shadow: 3px 3px #000; z-index: 100;
        }

        /* 箭靶 */
        .target {
            position: absolute; width: 90px; height: 90px;
            display: flex; justify-content: center; align-items: center;
            cursor: crosshair; z-index: 50;
            animation: popIn 0.3s ease-out forwards;
        }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

        .target-circle {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, white 15%, var(--target-red) 15%, var(--target-red) 35%, white 35%, white 55%, var(--target-red) 55%);
            border: 3px solid #000; border-radius: 50%;
        }

        .target-label {
            position: relative; z-index: 2; background: white; color: #000;
            font-weight: bold; padding: 2px 8px; border: 2px solid #000; border-radius: 5px;
        }

        /* 效果動畫 */
        .shake { animation: shake 0.3s; }
        @keyframes shake { 0%, 100% { left: 0; } 25% { left: -10px; } 75% { left: 10px; } }

        .particle {
            position: absolute; width: 8px; height: 8px; border-radius: 2px;
            pointer-events: none; z-index: 60; animation: pAnim 0.6s ease-out forwards;
        }
        @keyframes pAnim { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
</audio>

<div id="game-container">
    <div class="sea-bed"></div>
    <div class="coral" style="left: 100px;"></div>
    <div class="coral" style="right: 150px; background: #9b59b6; box-shadow: -10px -5px 0 #9b59b6;"></div>
    <div id="deco-layer"></div>

    <div id="start-page" class="page active-page">
        <h1 style="font-size: 3.5rem; color: #fff; text-shadow: 5px 5px #000; margin: 0;">ArcherSprayer</h1>
        <div class="instruction-box">
            🌊 <b>海洋保育行動</b> 🌊<br>
            海水的酸鹼值大約為 8.1 至 8.2，低於此數值即為<b>海水酸化危機</b>。<br>
            請監察數值，當 <b>pH 低於 8.1</b> 時，立刻噴射鐵粉救救海洋！
        </div>
        <button class="btn" onclick="goToGame()">開始救助 START</button>
    </div>

    <div id="play-page" class="page">
        <div id="game-hud">
            <div>⏰ <span id="timer">30</span>s</div>
            <div>SCORE: <span id="score">0</span></div>
        </div>
    </div>

    <div id="end-page" class="page">
        <h1 style="font-size: 3rem; color: #fff;">任務完成！</h1>
        <div style="font-size: 3rem; color: var(--mario-yellow); margin: 20px 0;">最終得分：<span id="final-score">0</span></div>
        <p style="color: white; font-size: 1.4rem;">感謝您為海洋出一分力！🐢</p>
        <button class="btn" onclick="goToGame()">再玩一次 AGAIN</button>
    </div>
</div>

<script>
    const phValues = ["pH7.7", "pH7.8", "pH7.9", "pH7.6", "pH8.1", "pH8.2"];
    let score = 0;
    let timeLeft = 30;
    let gameTimer = null;
    let spawnTimer = null;
    const bgMusic = document.getElementById('bgMusic');

    // 徹底修正頁面切換：直接修改 Style 確保生效
    function changePage(targetId) {
        // 隱藏所有頁面
        const pages = document.querySelectorAll('.page');
        pages.forEach(p => {
            p.style.display = 'none';
            p.classList.remove('active-page');
        });

        // 顯示目標頁面
        const target = document.getElementById(targetId);
        target.style.display = 'flex';
        target.classList.add('active-page');
    }

    function goToGame() {
        // 音樂處理
        bgMusic.play().catch(() => console.log("Music waiting for interaction"));
        
        // 重置數值
        score = 0;
        timeLeft = 30;
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeLeft;
        
        // 清理環境
        clearInterval(gameTimer);
        clearInterval(spawnTimer);
        const oldTargets = document.querySelectorAll('.target');
        oldTargets.forEach(t => t.remove());

        // 切換頁面
        changePage('play-page');

        // 計時器
        gameTimer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);

        // 生成箭靶 (頻率加快一點讓遊戲更好玩)
        spawnTimer = setInterval(createTarget, 800);
    }

    function createTarget() {
        const container = document.getElementById('play-page');
        if (container.style.display === 'none') return;

        const target = document.createElement('div');
        target.className = 'target';
        
        const val = phValues[Math.floor(Math.random() * phValues.length)];
        target.innerHTML = `<div class="target-circle"></div><div class="target-label">${val}</div>`;

        // 隨機位置
        const x = 50 + Math.random() * 650;
        const y = 100 + Math.random() * 350;
        target.style.left = x + 'px';
        target.style.top = y + 'px';

        target.onmousedown = function(e) {
            e.preventDefault();
            const isCrisis = (val.includes("7.") || val === "pH7.6"); // 低於 8.1 的判斷

            if (isCrisis) {
                score++;
                spawnParticles(x + 45, y + 45, '#2ecc71'); // 綠色粒子
                target.remove(); 
            } else {
                score--;
                target.classList.add('shake');
                setTimeout(() => { if(target.parentNode) target.remove(); }, 300);
            }
            document.getElementById('score').innerText = score;
        };

        container.appendChild(target);

        // 2秒後淡出消失
        setTimeout(() => {
            if(target.parentNode) {
                target.style.transition = "opacity 0.5s";
                target.style.opacity = "0";
                setTimeout(() => { if(target.parentNode) target.remove(); }, 500);
            }
        }, 2000);
    }

    function spawnParticles(x, y, color) {
        for (let i = 0; i < 12; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.style.background = color;
            const angle = Math.random() * Math.PI * 2;
            const dist = 30 + Math.random() * 70;
            p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
            p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
            document.getElementById('play-page').appendChild(p);
            setTimeout(() => p.remove(), 600);
        }
    }

    function endGame() {
        clearInterval(gameTimer);
        clearInterval(spawnTimer);
        document.getElementById('final-score').innerText = score;
        changePage('end-page');
    }

    // 生成背景生物
    function initOcean() {
        const deco = document.getElementById('deco-layer');
        const sprites = ['🐟', '🐠', '🐡', '🐢', '🦑'];
        for(let i = 0; i < 8; i++) {
            const s = document.createElement('div');
            s.className = 'fish';
            s.innerText = sprites[Math.floor(Math.random() * sprites.length)];
            s.style.top = (100 + Math.random() * 400) + 'px';
            s.style.animationDuration = (10 + Math.random() * 15) + 's';
            s.style.animationDelay = (Math.random() * 10) + 's';
            deco.appendChild(s);
        }
    }
    initOcean();
</script>

</body>
</html>
